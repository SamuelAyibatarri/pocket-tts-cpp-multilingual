name: Build Shared Libraries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux-x64
            rid: linux-x64
            files: "libpocket_tts.so libonnxruntime.so*"
          - os: windows-latest
            plat: win-x64
            rid: win-x64
            files: "Release/pocket_tts.dll Release/onnxruntime.dll pocket_tts.dll onnxruntime.dll"
          - os: macos-latest
            plat: macos-arm64
            rid: osx-arm64
            files: "libpocket_tts.dylib libonnxruntime.dylib"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Stage ONNX Runtime 1.23.2 from Microsoft NuGet
        shell: bash
        run: |
          ORT_VER=1.23.2
          PY=$(command -v python3 || command -v python)
          curl -fSL "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/${ORT_VER}/microsoft.ml.onnxruntime.${ORT_VER}.nupkg" -o ort.nupkg
          "$PY" -c "
          import zipfile, pathlib, shutil
          rid = '${{ matrix.rid }}'
          inc_out = pathlib.Path('ort/include')
          lib_out = pathlib.Path('ort/lib')
          inc_out.mkdir(parents=True, exist_ok=True)
          lib_out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('ort.nupkg') as zf:
              for info in zf.infolist():
                  n = info.filename
                  if n.endswith('/'):
                      continue
                  if n.startswith('build/native/include/'):
                      rel = n[len('build/native/include/'):]
                      dst = inc_out / rel
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as s, open(dst, 'wb') as d:
                          shutil.copyfileobj(s, d)
                  elif n.startswith(f'runtimes/{rid}/native/'):
                      rel = n[len(f'runtimes/{rid}/native/'):]
                      dst = lib_out / rel
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as s, open(dst, 'wb') as d:
                          shutil.copyfileobj(s, d)
          "
          ls -la ort/include ort/lib

      - name: Configure CMake
        shell: bash
        run: |
          ORT_ROOT="$(pwd -W 2>/dev/null || pwd)/ort"
          cmake -B .build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIB=ON -DLOCAL_ORT_ROOT="$ORT_ROOT"

      - name: Build pocket-tts-lib
        run: cmake --build .build --config Release --target pocket-tts-lib -j4

      - name: Stage native binaries
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.plat }}
          for f in ${{ matrix.files }}; do
            [ -f "$f" ] && cp -L "$f" dist/${{ matrix.plat }}/
          done
          ls -lh dist/${{ matrix.plat }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-${{ matrix.plat }}
          path: dist/${{ matrix.plat }}/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip per-platform binaries
        run: |
          mkdir -p release-zips
          for dir in artifacts/pocket-tts-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../release-zips/${name}.zip" .)
          done
          ls -lh release-zips/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-zips/*.zip
