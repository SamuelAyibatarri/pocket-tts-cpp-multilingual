name: Build Shared Libraries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux-x64
            files: "libpocket_tts.so libonnxruntime.so*"
          - os: windows-latest
            plat: win-x64
            files: "Release/pocket_tts.dll Release/onnxruntime.dll pocket_tts.dll onnxruntime.dll"
          - os: macos-14
            plat: macos-arm64
            files: "libpocket_tts.dylib libonnxruntime.dylib"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B .build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIB=ON

      - name: Build pocket-tts-lib
        run: cmake --build .build --config Release --target pocket-tts-lib -j4

      - name: Stage native binaries
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.plat }}
          for f in ${{ matrix.files }}; do
            [ -f "$f" ] && cp -L "$f" dist/${{ matrix.plat }}/
          done
          ls -lh dist/${{ matrix.plat }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-${{ matrix.plat }}
          path: dist/${{ matrix.plat }}/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip per-platform binaries
        run: |
          mkdir -p release-zips
          for dir in artifacts/pocket-tts-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../release-zips/${name}.zip" .)
          done
          ls -lh release-zips/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-zips/*.zip
